name: Build 7-Zip

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            runner: windows-latest
            arch: x86
          - platform: x64
            runner: windows-latest
            arch: x64
          - platform: arm64
            runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone2
          nmake PLATFORM=${{ matrix.platform }} > build.log 2>&1
          type build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-${{ matrix.platform }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn

      - name: Locate binary
        id: locate
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path CPP/7zip/Bundles/Alone2 -Recurse -Filter "7zz.exe" | Select-Object -First 1
          if (-not $bin) { throw "7zz.exe not found" }
          echo "path=$($bin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-windows-${{ matrix.platform }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            makefile: cmpl_gcc_x64.mak
            cross: ""
            asmc: true
          - target: linux-x86
            runner: ubuntu-latest
            makefile: cmpl_gcc_x86.mak
            cross: ""
            asmc: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            makefile: cmpl_gcc_arm64.mak
            cross: ""
            asmc: false
          - target: linux-arm
            runner: ubuntu-latest
            makefile: cmpl_gcc_arm.mak
            cross: "arm-linux-gnueabihf-"
            asmc: false
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y build-essential
          if [ -n "${{ matrix.cross }}" ]; then
            sudo apt-get install -y gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi

      - name: Try ASMC
        if: matrix.asmc
        continue-on-error: true
        run: |
          set -x
          git clone --depth 1 https://github.com/nidud/asmc_linux /tmp/asmc
          cd /tmp/asmc
          make -j$(nproc)
          sudo make install
          asmc -? | head -3

      - name: Normalize line endings
        run: |
          set -x
          find . -name "*.mak" -exec sed -i 's/\r$//' {} \;

      - name: Build
        run: |
          set -x
          set -o pipefail
          cd CPP/7zip/Bundles/Alone2
          ARGS="-j$(nproc) -f ../../${{ matrix.makefile }}"
          if [ -n "${{ matrix.cross }}" ]; then
            ARGS="$ARGS CROSS_COMPILE=${{ matrix.cross }}"
          fi
          if command -v asmc >/dev/null 2>&1; then
            ARGS="$ARGS USE_ASM=1 MY_ASM=asmc"
          fi
          make $ARGS 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.target }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn

      - name: Locate binary
        id: locate
        run: |
          set -x
          BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "7zz not found; tail of build.log:"
            tail -50 CPP/7zip/Bundles/Alone2/build.log 2>/dev/null || echo "(no build.log)"
            exit 1
          fi
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-13
            makefile: cmpl_mac_x64.mak
            var: var_mac_x64.mak
            asmc: true
          - target: macos-arm64
            runner: macos-latest
            makefile: cmpl_mac_arm64.mak
            var: var_mac_arm64.mak
            asmc: false
    steps:
      - uses: actions/checkout@v4

      - name: Try ASMC
        if: matrix.asmc
        continue-on-error: true
        run: |
          set -x
          git clone --depth 1 https://github.com/nidud/asmc /tmp/asmc
          cd /tmp/asmc/source/asmc
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          asmc -? | head -3

      - name: Normalize line endings
        run: |
          set -x
          find . -name "*.mak" -exec sed -i '' 's/\r$//' {} \;

      - name: Build
        run: |
          set -x
          set -o pipefail
          cd CPP/7zip/Bundles/Alone2
          ARGS="-j$(sysctl -n hw.ncpu) -f ../../${{ matrix.makefile }} ${{ matrix.var }}"
          if command -v asmc >/dev/null 2>&1; then
            ARGS="$ARGS USE_ASM=1 MY_ASM=asmc"
          fi
          make $ARGS 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.target }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn

      - name: Locate binary
        id: locate
        run: |
          set -x
          BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "7zz not found; tail of build.log:"
            tail -50 CPP/7zip/Bundles/Alone2/build.log 2>/dev/null || echo "(no build.log)"
            exit 1
          fi
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 7zip-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error