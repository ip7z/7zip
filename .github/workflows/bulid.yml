name: Build 7-Zip

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 让 make / nmake 尽可能使用 runner 的全部核心
  MAKEFLAGS: -j
  # 禁用 Python/Node 等无用的 telemetry
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  windows-msvc:
    name: Windows MSVC ${{ matrix.platform }} (${{ matrix.asm_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            runner: windows-latest
            arch: x86
            asm_name: MASM
          - platform: x64
            runner: windows-latest
            arch: x64
            asm_name: MASM
          - platform: arm64
            runner: windows-11-arm
            arch: arm64
            asm_name: armasm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone2
          nmake PLATFORM=${{ matrix.platform }} > build.log 2>&1
          type build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-windows-msvc-${{ matrix.platform }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate binary
        id: locate
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path CPP/7zip/Bundles/Alone2 -Recurse -Filter "7zz.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem -Path CPP/7zip/Bundles/Alone2 -Recurse -Filter *.exe |
              Select-Object FullName | Format-Table -AutoSize
            throw "7zz.exe not found"
          }
          echo "path=$($bin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 7zip-windows-msvc-${{ matrix.platform }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  windows-clang:
    name: Windows Clang ${{ matrix.platform }} (${{ matrix.asm_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            runner: windows-latest
            arch: x86
            asm_name: MASM
          - platform: x64
            runner: windows-latest
            arch: x64
            asm_name: MASM
          - platform: arm64
            runner: windows-11-arm
            arch: arm64
            asm_name: armasm64
    steps:
      - uses: actions/checkout@v5

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: C:\Program Files\LLVM
          key: llvm-windows-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: choco install llvm -y

      - name: Add LLVM to PATH
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build
        shell: cmd
        run: |
          cd CPP\7zip\Bundles\Alone2
          clang-cl --version
          where link
          nmake PLATFORM=${{ matrix.platform }} CC=clang-cl > build.log 2>&1
          type build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-windows-clang-${{ matrix.platform }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate binary
        id: locate
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path CPP/7zip/Bundles/Alone2 -Recurse -Filter "7zz.exe" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if (-not $bin) {
            Get-ChildItem -Path CPP/7zip/Bundles/Alone2 -Recurse -Filter *.exe |
              Select-Object FullName | Format-Table -AutoSize
            throw "7zz.exe not found"
          }
          echo "path=$($bin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 7zip-windows-clang-${{ matrix.platform }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  linux-gcc:
    name: Linux GCC ${{ matrix.target }} (${{ matrix.asm_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runner: ubuntu-latest
            makefile: cmpl_gcc_x64.mak
            cross: ""
            multilib: false
            asmc: true
            asm_name: ASMC
          - target: x86
            runner: ubuntu-latest
            makefile: cmpl_gcc_x86.mak
            cross: ""
            multilib: true
            asmc: false
            asm_name: None (C only)
          - target: arm64
            runner: ubuntu-24.04-arm
            makefile: cmpl_gcc_arm64.mak
            cross: ""
            multilib: false
            asmc: false
            asm_name: GNU as
          - target: arm
            runner: ubuntu-latest
            makefile: cmpl_gcc_arm.mak
            cross: "arm-linux-gnueabihf-"
            multilib: false
            asmc: false
            asm_name: GNU as
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential
          if [ -n "${{ matrix.cross }}" ]; then
            sudo apt-get install -y -qq gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
          fi
          if [ "${{ matrix.multilib }}" = "true" ]; then
            sudo apt-get install -y -qq gcc-multilib g++-multilib
          fi

      - name: Cache ASMC
        if: matrix.asmc
        id: cache-asmc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/asmc
          key: asmc-linux-${{ runner.arch }}-v1

      - name: Install ASMC
        if: matrix.asmc && steps.cache-asmc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/nidud/asmc_linux /tmp/asmc
          cd /tmp/asmc
          make -j$(nproc)
          sudo make install
          asmc -? | head -3

      - name: Normalize line endings
        run: find . -name "*.mak" -exec sed -i 's/\r$//' {} \;

      - name: Build
        run: |
          cd CPP/7zip/Bundles/Alone2
          ARGS="-j$(nproc) -f ../../${{ matrix.makefile }}"
          if [ -n "${{ matrix.cross }}" ]; then
            ARGS="$ARGS CROSS_COMPILE=${{ matrix.cross }}"
          fi
          if [ "${{ matrix.asmc }}" = "true" ] && command -v asmc >/dev/null 2>&1; then
            ARGS="$ARGS USE_ASM=1 MY_ASM=asmc AFLAGS_ABI='-arch:AVX -c'"
          fi
          make $ARGS > build.log 2>&1 || { tail -100 build.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-linux-gcc-${{ matrix.target }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate binary
        id: locate
        run: |
          BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            tail -50 CPP/7zip/Bundles/Alone2/build.log
            exit 1
          fi
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 7zip-linux-gcc-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  linux-clang:
    name: Linux Clang ${{ matrix.target }} (${{ matrix.asm_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runner: ubuntu-latest
            makefile: cmpl_clang_x64.mak
            multilib: false
            asmc: true
            asm_name: ASMC
          - target: x86
            runner: ubuntu-latest
            makefile: cmpl_clang_x86.mak
            multilib: true
            asmc: false
            asm_name: None (C only)
          - target: arm64
            runner: ubuntu-24.04-arm
            makefile: cmpl_clang_arm64.mak
            multilib: false
            asmc: false
            asm_name: GNU as
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang
          if [ "${{ matrix.multilib }}" = "true" ]; then
            sudo apt-get install -y -qq gcc-multilib g++-multilib
          fi

      - name: Cache ASMC
        if: matrix.asmc
        id: cache-asmc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/asmc
          key: asmc-linux-${{ runner.arch }}-v1

      - name: Install ASMC
        if: matrix.asmc && steps.cache-asmc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/nidud/asmc_linux /tmp/asmc
          cd /tmp/asmc
          make -j$(nproc)
          sudo make install
          asmc -? | head -3

      - name: Normalize line endings
        run: find . -name "*.mak" -exec sed -i 's/\r$//' {} \;

      - name: Build
        run: |
          cd CPP/7zip/Bundles/Alone2
          ARGS="-j$(nproc) -f ../../${{ matrix.makefile }}"
          if [ "${{ matrix.asmc }}" = "true" ] && command -v asmc >/dev/null 2>&1; then
            ARGS="$ARGS USE_ASM=1 MY_ASM=asmc AFLAGS_ABI='-arch:AVX -c'"
          fi
          make $ARGS > build.log 2>&1 || { tail -100 build.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-linux-clang-${{ matrix.target }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate binary
        id: locate
        run: |
          BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            tail -50 CPP/7zip/Bundles/Alone2/build.log
            exit 1
          fi
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 7zip-linux-clang-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  macos-clang:
    name: macOS Clang ${{ matrix.target }} (${{ matrix.asm_name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runner: macos-13
            makefile: cmpl_mac_x64.mak
            asmc: true
            asm_name: ASMC
          - target: arm64
            runner: macos-latest
            makefile: cmpl_mac_arm64.mak
            asmc: false
            asm_name: Clang as
    steps:
      - uses: actions/checkout@v5

      - name: Cache ASMC
        if: matrix.asmc
        id: cache-asmc
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/asmc
          key: asmc-macos-${{ runner.arch }}-v1

      - name: Install ASMC
        if: matrix.asmc && steps.cache-asmc.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/nidud/asmc /tmp/asmc
          cd /tmp/asmc/source/asmc
          make -j$(sysctl -n hw.ncpu)
          sudo make install
          asmc -? | head -3

      - name: Normalize line endings
        run: find . -name "*.mak" -exec sed -i '' 's/\r$//' {} \;

      - name: Build
        run: |
          cd CPP/7zip/Bundles/Alone2
          ARGS="-j$(sysctl -n hw.ncpu) -f ../../${{ matrix.makefile }}"
          if [ "${{ matrix.asmc }}" = "true" ] && command -v asmc >/dev/null 2>&1; then
            ARGS="$ARGS USE_ASM=1 MY_ASM=asmc AFLAGS_ABI='-arch:AVX -c'"
          fi
          make $ARGS > build.log 2>&1 || { tail -100 build.log; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: log-macos-clang-${{ matrix.target }}
          path: CPP/7zip/Bundles/Alone2/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Locate binary
        id: locate
        run: |
          BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz -executable 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find CPP/7zip/Bundles/Alone2 -type f -name 7zz 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            tail -50 CPP/7zip/Bundles/Alone2/build.log
            exit 1
          fi
          echo "path=$BIN" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: 7zip-macos-clang-${{ matrix.target }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 9